<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Дневник КБЖУ</title>
<meta name="theme-color" content="#EDF2EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121a17" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Туманное утро в саду: мягкий шалфей, приглушённые акценты БЖУ, округлые формы. Одна колонка, вкладки сверху, добавление еды внизу. */
:root{
  --bg:#EDF2EF; --bg2:#E4ECE8; --surface:#FAFCFB; --surface2:#F2F6F4; --ink:#2A3833; --muted:#7B8B85; --line:#DCE5E0;
  --accent:#5E927C; --accent2:#8DB8A5; --accent-soft:#DDEBE4; --on-accent:#FFFFFF;
  --prot:#7C9CC4; --fat:#CFAE6B; --carb:#CF917E; --danger:#C0675A; --glow:rgba(94,146,124,.18);
  --display:"Comfortaa","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:20px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121a17; --bg2:#16211d; --surface:#1b2622; --surface2:#202d28; --ink:#E1EBE6; --muted:#93A59D; --line:#2a3833;
  --accent:#8CC2AA; --accent2:#5E927C; --accent-soft:#223a31; --on-accent:#0f1a16;
  --prot:#9DB8E0; --fat:#E2C489; --carb:#E3A894; --danger:#EC9487; --glow:rgba(140,194,170,.14); color-scheme:dark}}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font:16px/1.5 var(--body);-webkit-tap-highlight-color:transparent;
  background:radial-gradient(120% 60% at 15% -10%,var(--bg2),transparent 60%),radial-gradient(90% 50% at 110% 20%,var(--accent-soft),transparent 60%),var(--bg);
  background-attachment:fixed;
  padding-top:env(safe-area-inset-top,0px);padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-block:0 140px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:.9}}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:14px 8px;
  background:linear-gradient(var(--bg) 75%,transparent)}
.toprow{display:flex;align-items:center;gap:10px}
.greet{flex:1;min-width:0}
.greet small{display:block;color:var(--muted);font-size:13px}
.greet b{font:700 19px/1.2 var(--display);display:block}
.datenav{display:flex;align-items:center;background:var(--surface);border-radius:999px;padding:3px;box-shadow:0 1px 0 var(--line)}
.datenav button{border:0;background:none;width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;color:var(--muted)}
.datenav button:disabled{opacity:.3;cursor:default}
.datenav span{min-width:84px;text-align:center;font-weight:600;font-size:14px}
.icon-btn{border:0;background:var(--surface);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);box-shadow:0 1px 0 var(--line)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-top:12px;background:var(--surface2);border-radius:999px;padding:4px}
.tabs button{border:0;background:none;border-radius:999px;padding:8px 2px;font-size:13.5px;font-weight:600;color:var(--muted);transition:background .25s,color .25s}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px var(--glow)}

.view{animation:rise .35s ease both}
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:0 1px 0 var(--line),0 8px 24px var(--glow)}
.summary{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .halo{position:absolute;inset:14px;border-radius:50%;background:radial-gradient(var(--accent-soft),transparent 70%);animation:breathe 6s ease-in-out infinite}
.ring .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .big{font:700 26px/1 var(--display)}
.ring .small{font-size:12px;color:var(--muted);margin-top:6px}
.macros{display:grid;gap:12px;min-width:0}
.macro .row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.macro .row b{font-weight:600}
.macro .row span{color:var(--muted);font-size:13px}
.bar{height:7px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .6s ease}
.left-line{grid-column:1/-1;font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--surface2);border-radius:14px;padding:10px 14px}
.left-line b{color:var(--ink);font-weight:700}
.over b{color:var(--danger)}

.sec-title{display:flex;align-items:center;gap:8px;margin:26px 2px 10px;font:700 15px/1.2 var(--display)}
.sec-title .sum{margin-left:auto;font:600 14px var(--body);color:var(--muted)}
.sec-title .plus{border:0;background:var(--accent-soft);color:var(--accent);width:30px;height:30px;border-radius:50%;font-size:19px;line-height:1}
.list{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 0 var(--line)}
.entry{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:13px 16px;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry .nm{flex:1;min-width:0}
.entry .nm div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.entry .nm small{color:var(--muted);font-size:12.5px}
.entry .kc{font-weight:700;white-space:nowrap}
.entry .kc small{font-weight:400;color:var(--muted);font-size:12px;margin-left:2px}
.empty{font-size:14px;color:var(--muted);padding:2px 4px}
.hint{margin-top:22px;border:1.5px dashed var(--line);border-radius:var(--r);padding:16px 18px;color:var(--muted);font-size:14.5px}
.hint b{color:var(--ink)}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:0 1px 0 var(--line)}
.stat small{display:block;color:var(--muted);font-size:12.5px}
.stat b{font:700 22px/1.3 var(--display)}
.stat span{font-size:13px;color:var(--muted)}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(to top,var(--bg) 65%,transparent);
  padding:20px max(18px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.dock .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.dbtn{border:0;background:var(--surface);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13.5px;font-weight:600;box-shadow:0 1px 0 var(--line),0 6px 18px var(--glow)}
.dbtn.main{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent)}
.dbtn svg{width:22px;height:22px}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(18,30,26,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;animation:up .3s ease both;
  padding:8px max(18px,env(safe-area-inset-right,0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sheet h3{font:700 18px/1.25 var(--display);margin:0 0 16px;display:flex;align-items:center;gap:8px}
.sheet h3 .x{margin-left:auto;border:0;background:var(--surface);font-size:22px;line-height:1;color:var(--muted);width:36px;height:36px;border-radius:50%}
.stack{display:grid;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--surface);border-radius:999px;padding:8px 13px;font-size:14px;box-shadow:0 1px 0 var(--line)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--surface);border-radius:16px;padding:13px 16px;font-weight:700;text-align:center;box-shadow:0 1px 0 var(--line)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent)}
.btn.danger{color:var(--danger)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1}
.picker{position:relative;overflow:hidden;width:100%}
.picker input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}
label.field{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
input[type=text],input[type=number],input[type=password],textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.preview{border-radius:16px;max-height:220px;width:100%;object-fit:cover;display:block}
.status{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.status.err{color:var(--danger)}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.items{display:grid;gap:8px}
.item{background:var(--surface);border-radius:16px;padding:11px 13px;display:grid;gap:6px;box-shadow:0 1px 0 var(--line)}
.item .top{display:flex;align-items:center;gap:10px}
.item .top label{flex:1;min-width:0;display:flex;gap:8px;align-items:center;font-weight:600}
.item .top input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);flex:none}
.item .g{width:76px;padding:6px 8px;font-size:15px;text-align:right}
.item .sub{font-size:12.5px;color:var(--muted)}
.item .kcal{min-width:64px;text-align:right;font-weight:700}
.total-line{display:flex;justify-content:space-between;gap:8px;font-weight:700;padding:4px 2px}
.prodcard{background:var(--accent-soft);border-radius:16px;padding:12px 15px;font-size:14.5px}
.code{font:600 15px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em}
.scanbox{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox .aim{position:absolute;left:12%;right:12%;top:38%;bottom:38%;border:2px solid rgba(255,255,255,.85);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
details summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:14.5px;padding:4px 0}
.small-note{font-size:12.5px;color:var(--muted)}
.ing{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14.5px}
.ing:first-child{border-top:0}
.ing span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ing small{color:var(--muted)}
.ing button{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;width:28px;height:28px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14.5px;max-width:calc(100% - 48px);text-align:center;animation:rise .25s ease both}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
@media (max-width:380px){.summary{grid-template-columns:1fr;justify-items:center}.macros{width:100%}.grid4{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="toprow">
      <div class="greet"><small id="greetSmall">Добрый день</small><b id="greetBig">Дневник</b></div>
      <div class="datenav" id="dateNav">
        <button id="prevDay" aria-label="Предыдущий день">‹</button>
        <span id="dateLabel">Сегодня</span>
        <button id="nextDay" aria-label="Следующий день">›</button>
      </div>
      <button class="icon-btn" id="openSettings" aria-label="Цели и настройки">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>
      </button>
    </div>
    <nav class="tabs" role="tablist" aria-label="Разделы">
      <button role="tab" data-tab="day" aria-selected="true">День</button>
      <button role="tab" data-tab="week" aria-selected="false">Неделя</button>
      <button role="tab" data-tab="weight" aria-selected="false">Вес</button>
      <button role="tab" data-tab="recipes" aria-selected="false">Кухня</button>
      <button role="tab" data-tab="sport" aria-selected="false">Спорт</button>
    </nav>
  </header>
  <main id="view"></main>
</div>

<nav class="dock" id="dock" aria-label="Добавить еду">
  <div class="in">
    <button class="dbtn main" data-add="photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Фото еды</button>
    <button class="dbtn" data-add="barcode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6v12M7 6v12M10 6v12M14 6v12M16 6v12M20 6v12"/></svg>Штрих-код</button>
    <button class="dbtn" data-add="manual">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Вручную</button>
  </div>
</nav>

<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const MEALS=[["breakfast","Завтрак"],["lunch","Обед"],["dinner","Ужин"],["snack","Перекус"]];
const MEAL_NAME=Object.fromEntries(MEALS);
const S={settings:{goal:2000,p:110,f:65,c:230,goalW:null,recent:[]},date:ds(new Date()),day:{entries:[]},tab:"day"};

const $=s=>document.querySelector(s);
function ds(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return ds(d)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function num(v){const n=parseFloat(String(v??"").replace(",","."));return isFinite(n)&&n>=0?n:0}
const r0=Math.round, r1=n=>Math.round(n*10)/10;
function fmt(n){return r0(n).toLocaleString("ru-RU")}
function fmt1(n){return r1(n).toLocaleString("ru-RU")}
function calc(p,g){const k=g/100;return{k:p.k*k,p:p.p*k,f:p.f*k,c:p.c*k}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function defaultMeal(){const h=new Date().getHours();return h<11?"breakfast":h<16?"lunch":h<21?"dinner":"snack"}
function shortDate(s){return new Date(s+"T12:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"short"})}

/* ---------- хранение на телефоне ---------- */
const store={
  get(k){try{const v=localStorage.getItem("kbju:"+k);return v?JSON.parse(v):null}catch(e){return null}},
  set(k,v){try{localStorage.setItem("kbju:"+k,JSON.stringify(v))}catch(e){toast("Не удалось сохранить: память браузера переполнена")}},
  del(k){try{localStorage.removeItem("kbju:"+k)}catch(e){}}
};
function getDay(d){const x=store.get("day-"+d);return x&&Array.isArray(x.entries)?x:{entries:[]}}
function loadDay(){S.day=getDay(S.date);render()}
const saveDay=()=>store.set("day-"+S.date,S.day);
const saveSettings=()=>store.set("settings",S.settings);
const getRecipes=()=>store.get("recipes")||[];
const saveRecipes=r=>store.set("recipes",r);
const getWeights=()=>store.get("weights")||{};
const saveWeights=w=>store.set("weights",w);

/* ---------- общая отрисовка ---------- */
function totals(list){return list.reduce((t,e)=>{const v=calc(e.per100,e.grams);t.k+=v.k;t.p+=v.p;t.f+=v.f;t.c+=v.c;return t},{k:0,p:0,f:0,c:0})}
function header(){
  const h=new Date().getHours();
  $("#greetSmall").textContent=h<5?"Доброй ночи":h<12?"Доброе утро":h<18?"Добрый день":"Добрый вечер";
  $("#greetBig").textContent={day:"Дневник",week:"Неделя",weight:"Вес",recipes:"Кухня",sport:"Спорт"}[S.tab];
  const today=ds(new Date()),y=addDays(today,-1);
  $("#dateNav").hidden=!(S.tab==="day"||S.tab==="week");
  $("#dateLabel").textContent=S.tab==="week"?`до ${S.date===today?"сегодня":shortDate(S.date)}`:
    S.date===today?"Сегодня":S.date===y?"Вчера":new Date(S.date+"T12:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"short",weekday:"short"});
  $("#nextDay").disabled=S.date>=today;
  document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  $("#dock").hidden=S.tab!=="day";
}
function render(){header();({day:renderDay,week:renderWeek,weight:renderWeight,recipes:renderRecipes,sport:renderSport})[S.tab]()}
function setView(html){const v=$("#view");v.innerHTML=`<div class="view">${html}</div>`}

/* ---------- День ---------- */
function renderDay(){
  const today=ds(new Date());
  const t=totals(S.day.entries),g=S.settings,R=56,C=2*Math.PI*R,frac=Math.min(t.k/(g.goal||1),1),over=t.k>g.goal;
  const macro=(n,v,goal,col)=>`<div class="macro"><div class="row"><b>${n}</b><span class="num">${fmt(v)} / ${fmt(goal)} г</span></div><div class="bar"><i style="width:${Math.min(v/(goal||1)*100,100)}%;background:var(${col})"></i></div></div>`;
  setView(`<section class="card summary" aria-label="Итог дня">
    <div class="ring"><div class="halo"></div><svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true">
      <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent2)"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs>
      <circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="11"/>
      <circle cx="66" cy="66" r="${R}" fill="none" stroke="${over?"var(--danger)":"url(#rg)"}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}" style="transition:stroke-dashoffset .8s ease"/></svg>
      <div class="center"><div class="big num">${fmt(t.k)}</div><div class="small">из ${fmt(g.goal)} ккал</div></div></div>
    <div class="macros">${macro("Белки",t.p,g.p,"--prot")}${macro("Жиры",t.f,g.f,"--fat")}${macro("Углеводы",t.c,g.c,"--carb")}</div>

    ${list.length?`<div class="list">${list.map(e=>{const v=calc(e.per100,e.grams);return `<button class="entry" data-entry="${e.id}"><div class="nm"><div>${esc(e.name)}</div>
      <small class="num">${fmt(e.grams)} г · Б ${fmt1(v.p)} · Ж ${fmt1(v.f)} · У ${fmt1(v.c)}</small></div><div class="kc num">${fmt(v.k)}<small>ккал</small></div></button>`}).join("")}</div>`:`<div class="empty">Пока пусто</div>`}`}).join("")}

}

/* ---------- Неделя ---------- */
function renderWeek(){
  const days=[...Array(7)].map((_,i)=>addDays(S.date,i-6)).map(d=>({d,t:totals(getDay(d).entries),n:getDay(d).entries.length}));
  const today=ds(new Date()), any=days.filter(x=>x.n), done=any.filter(x=>x.d!==today), filled=done.length?done:any, g=S.settings;
  const avg=k=>filled.length?filled.reduce((s,x)=>s+x.t[k],0)/filled.length:0;
  const W=340,H=170,top=16,bot=30,maxK=Math.max(g.goal*1.25,...days.map(x=>x.t.k),1);
  const y=v=>top+(H-top-bot)*(1-v/maxK), bw=W/7;
  const bars=days.map((x,i)=>{const h=(H-top-bot)*x.t.k/maxK,over=x.t.k>g.goal,cx=i*bw+bw/2;
    return `<g data-goday="${x.d}" style="cursor:pointer"><rect x="${i*bw+6}" y="${top}" width="${bw-12}" height="${H-top-bot}" fill="transparent"/>
    <rect x="${i*bw+bw*.22}" y="${y(x.t.k)}" width="${bw*.56}" height="${Math.max(h,x.n?3:0)}" rx="8" fill="${over?"var(--carb)":"var(--accent2)"}" opacity="${x.d===S.date?1:.75}"/>
    ${x.n?`<text x="${cx}" y="${y(x.t.k)-5}" text-anchor="middle" font-size="10" fill="var(--muted)">${r0(x.t.k)}</text>`:""}
    <text x="${cx}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${new Date(x.d+"T12:00:00").toLocaleDateString("ru-RU",{weekday:"short"})}</text></g>`}).join("");
  const gy=y(g.goal);
  setView(`<div class="stats">
      <div class="stat"><small>В среднем за день</small><b class="num">${fmt(avg("k"))}</b> <span>ккал</span></div>
      <div class="stat"><small>Цель на день</small><b class="num">${fmt(g.goal)}</b> <span>ккал</span></div>
      <div class="stat"><small>Белки · Жиры · Углеводы</small><b class="num" style="font-size:17px">${fmt(avg("p"))} · ${fmt(avg("f"))} · ${fmt(avg("c"))}</b> <span>г</span></div>
      <div class="stat"><small>Дней с записями</small><b class="num">${any.length}</b> <span>из 7</span></div></div>
    <div class="card" style="margin-top:12px"><div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Калории по дням">
      <line x1="0" x2="${W}" y1="${gy}" y2="${gy}" stroke="var(--accent)" stroke-dasharray="4 5" stroke-width="1.5"/>${bars}</svg></div>
      <div class="legend"><span><i style="background:var(--accent)"></i>цель ${fmt(g.goal)} ккал</span><span><i style="background:var(--accent2)"></i>в норме</span><span><i style="background:var(--carb)"></i>выше цели</span></div>
      <div class="small-note" style="margin-top:6px">Нажми на столбик, чтобы открыть этот день.</div></div>
    <div class="hint" style="margin-top:14px">${!filled.length?"За эти 7 дней записей нет.":avg("k")<=g.goal?`<b>Неделя в норме.</b> В среднем ты на ${fmt(g.goal-avg("k"))} ккал ниже цели.`:`<b>Чуть выше цели.</b> В среднем на ${fmt(avg("k")-g.goal)} ккал в день. Один день ничего не решает — смотри на среднее.`} Среднее считается по дням с записями${done.length&&done.length<any.length?", без сегодняшнего — он ещё не закончился":""}.</div>
    ${any.length?`<button class="btn primary" data-act="review-week" style="width:100%;margin-top:12px">Разбор недели от нейросети</button>`:""}`);
  $("#view").querySelectorAll("[data-goday]").forEach(el=>el.addEventListener("click",()=>{S.date=el.dataset.goday;S.tab="day";loadDay()}));
}

/* ---------- Вес ---------- */
function renderWeight(){
  const w=getWeights(), dates=Object.keys(w).sort(), today=ds(new Date()), g=S.settings.goalW;
  const last=dates.length?w[dates[dates.length-1]]:null, first=dates.length?w[dates[0]]:null;
  const avg7=d=>{const xs=[...Array(7)].map((_,i)=>w[addDays(d,-i)]).filter(v=>v);return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null};
  const weekAgo=avg7(addDays(today,-7)), nowAvg=avg7(today);
  const pts=dates.filter(d=>d>=addDays(today,-89));
  let chart=`<div class="empty" style="padding:24px 4px;text-align:center">Впиши вес хотя бы два дня — появится график.</div>`;
  if(pts.length>=2){
    const W=340,H=190,l=34,rt=10,top=14,bot=26, d0=new Date(pts[0]+"T12:00:00"), span=Math.max(1,(new Date(pts[pts.length-1]+"T12:00:00")-d0)/864e5);
    const vals=pts.map(d=>w[d]).concat(g?[g]:[]), mn=Math.floor(Math.min(...vals)-0.5), mx=Math.ceil(Math.max(...vals)+0.5);
    const X=d=>l+(W-l-rt)*((new Date(d+"T12:00:00")-d0)/864e5)/span, Y=v=>top+(H-top-bot)*(1-(v-mn)/(mx-mn||1));
    const line=pts.map((d,i)=>`${i?"L":"M"}${X(d).toFixed(1)},${Y(w[d]).toFixed(1)}`).join("");
    const avgLine=pts.map((d,i)=>`${i?"L":"M"}${X(d).toFixed(1)},${Y(avg7(d)).toFixed(1)}`).join("");
    const ticks=[mn,(mn+mx)/2,mx].map(v=>`<text x="${l-6}" y="${Y(v)+3}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt1(v)}</text><line x1="${l}" x2="${W-rt}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/>`).join("");
    chart=`<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="График веса">${ticks}
      ${g?`<line x1="${l}" x2="${W-rt}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--accent)" stroke-dasharray="4 5" stroke-width="1.5"/>`:""}
      <path d="${line} L${X(pts[pts.length-1])},${H-bot} L${X(pts[0])},${H-bot} Z" fill="var(--accent-soft)" opacity=".6"/>
      <path d="${line}" fill="none" stroke="var(--accent2)" stroke-width="1.5" opacity=".8"/>
      <path d="${avgLine}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts.map(d=>`<circle cx="${X(d)}" cy="${Y(w[d])}" r="2.5" fill="var(--accent2)"/>`).join("")}
      <circle cx="${X(pts[pts.length-1])}" cy="${Y(w[pts[pts.length-1]])}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
      <text x="${l}" y="${H-8}" font-size="10" fill="var(--muted)">${shortDate(pts[0])}</text><text x="${W-rt}" y="${H-8}" text-anchor="end" font-size="10" fill="var(--muted)">${shortDate(pts[pts.length-1])}</text></svg></div>
      <div class="legend"><span><i style="background:var(--accent)"></i>среднее за 7 дней</span><span><i style="background:var(--accent2)"></i>каждый день</span>${g?`<span><i style="background:var(--accent);opacity:.6"></i>цель ${fmt1(g)} кг</span>`:""}</div>`;
  }
  const delta=(nowAvg&&weekAgo)?nowAvg-weekAgo:null;
  setView(`<div class="card stack"><div class="grid2" style="align-items:end"><label class="field">Вес сегодня, кг<input type="number" inputmode="decimal" step="0.1" id="wIn" value="${w[today]??""}" placeholder="${last??"Например, 82,4"}"></label>
      <button class="btn primary" id="wSave">Записать</button></div>
      <div class="small-note">Взвешивайся утром, до еды — так цифры честнее. Вес за день скачет на 1–2 кг, поэтому смотри на среднюю линию.</div></div>
    <div class="stats" style="margin-top:12px">
      <div class="stat"><small>Сейчас</small><b class="num">${last?fmt1(last):"—"}</b> <span>кг</span></div>
      <div class="stat"><small>За неделю (среднее)</small><b class="num">${delta==null?"—":(delta>0?"+":"")+fmt1(delta)}</b> <span>${delta==null?"":"кг"}</span></div>
      <div class="stat"><small>С начала</small><b class="num">${last&&first?(last-first>0?"+":"")+fmt1(last-first):"—"}</b> <span>${last&&first?"кг":""}</span></div>
      <div class="stat"><small>До цели</small><b class="num">${g&&last?fmt1(Math.abs(last-g)):"—"}</b> <span>${g?"кг":"задай в настройках"}</span></div></div>
    <div class="card" style="margin-top:12px">${chart}</div>
    ${dates.length?`<div class="sec-title">Записи</div><div class="list">${dates.slice(-10).reverse().map(d=>`<div class="ing"><span>${shortDate(d)}</span><b class="num">${fmt1(w[d])} кг</b><button data-wdel="${d}" aria-label="Удалить запись">×</button></div>`).join("")}</div>`:""}`);
  $("#wSave").addEventListener("click",()=>{const v=num($("#wIn").value);if(v<20||v>400){toast("Впиши вес в килограммах");return}
    const ww=getWeights();ww[today]=r1(v);saveWeights(ww);const nn=applyAutoNorm();toast(nn?`Вес записан. Новая норма: ${fmt(nn)} ккал`:"Вес записан");render()});
  $("#view").querySelectorAll("[data-wdel]").forEach(b=>b.addEventListener("click",()=>{const ww=getWeights();delete ww[b.dataset.wdel];saveWeights(ww);render()}));
}

/* ---------- Рецепты ---------- */
function recipePer100(r){const t=r.ingredients.reduce((s,i)=>{const v=calc(i.per100,i.grams);s.k+=v.k;s.p+=v.p;s.f+=v.f;s.c+=v.c;s.g+=i.grams;return s},{k:0,p:0,f:0,c:0,g:0});
  const W=r.cooked||t.g||1;return{per100:{k:r1(t.k/W*100),p:r1(t.p/W*100),f:r1(t.f/W*100),c:r1(t.c/W*100)},raw:t.g,total:t}}
/* ---------- Кухня: что есть дома, идеи, рецепты, меню, покупки ---------- */
const getPantry=()=>store.get("pantry")||[];
const savePantry=p=>store.set("pantry",p);
const getShop=()=>store.get("shopping")||[];
const saveShop=s=>store.set("shopping",s);
const K={ideas:null};
function addToPantry(names){const p=getPantry(),low=new Set(p.map(x=>x.toLowerCase()));let n=0;
  names.map(x=>String(x).trim()).filter(Boolean).forEach(x=>{if(!low.has(x.toLowerCase())){p.push(x);low.add(x.toLowerCase());n++}});savePantry(p);return n}
function addToShop(items){const s=getShop();let n=0;
  items.forEach(it=>{const nm=String(it.name).trim();if(!nm)return;const ex=s.find(x=>!x.done&&x.name.toLowerCase()===nm.toLowerCase());
    if(ex){ex.grams=(ex.grams||0)+(it.grams||0)}else{s.push({id:uid(),name:nm,grams:it.grams||0,done:false});n++}});saveShop(s);return n}
function genToRecipe(g){return{id:uid(),name:g.name,servings:g.servings,minutes:g.minutes,steps:g.steps||[],cooked:g.cookedWeight||null,
  ingredients:g.ingredients.filter(i=>i.grams>0).map(i=>({name:i.name,grams:i.grams,per100:{k:i.kcal100,p:i.protein100,f:i.fat100,c:i.carbs100}}))}}
function gramsText(g){return g>=1000?`${fmt1(g/1000)} кг`:g?`${fmt(g)} г`:""}
async function ask(payload,signal){
  const code=store.get("appCode");let res;
  try{res=await fetch("/api/analyze",{method:"POST",signal,headers:{"Content-Type":"application/json",...(code?{"x-app-code":code}:{})},body:JSON.stringify(payload)})}
  catch(e){if(e.name==="AbortError")throw e;throw new Error("Нет связи с сервером. Проверь интернет или включи VPN.")}
  const j=await res.json().catch(()=>({}));
  if(res.status===401&&j.needCode){askCode(!!code);throw new Error("Нужен код доступа.")}
  if(!res.ok)throw new Error(j.error||"Сервер ответил ошибкой. Попробуй ещё раз.");
  return j;
}
let kitchenCtl=null;
function kitchenBusy(btn,stEl,text){kitchenCtl?.abort();kitchenCtl=new AbortController();if(btn)btn.disabled=true;setStatus(stEl,"busy",text);return kitchenCtl.signal}
function renderRecipes(){

  const left=shop.filter(x=>!x.done).length;

      ${photoPicker("pantryFile","Сфоткать холодильник",!pantry.length)}

      <div class="chips" role="group" aria-label="Сколько блюд">${[3,4,5].map(n=>`<button class="chip" data-mcount="${n}" aria-pressed="${n===(store.get("menuCount")||4)}">${n} блюда</button>`).join("").replace("5 блюда","5 блюд")}</div>
      <button class="btn primary" id="menuGo">Составить меню</button><div class="status" id="menuSt" hidden></div>

      <small class="num">на 100 г: Б ${fmt1(p.p)} · Ж ${fmt1(p.f)} · У ${fmt1(p.c)}</small></div><div class="kc num">${fmt(p.k)}<small>ккал/100 г</small></div></button>`}).join("")}</div>`:
    `<div class="hint"><b>Готовишь заранее?</b> Сохрани рецепт из идей или меню, либо внеси свою кастрюлю вручную — калории на 100 г посчитаются сами, а порцию потом добавишь по весу.</div>`}`);
  const V=$("#view");
  // что есть дома

    try{const j=await ask({mode:"ideas",pantry:getPantry(),...pr},sig);K.ideas=j.ideas||[];setStatus($("#ideasSt"),K.ideas.length?"":"err",K.ideas.length?"":"Не получилось придумать. Попробуй ещё раз.");drawIdeas(K.ideas)}
    catch(err){if(err.name!=="AbortError")setStatus($("#ideasSt"),"err",err.message)}finally{if($("#ideasGo"))$("#ideasGo").disabled=false}});
  function drawIdeas(list){$("#ideasBox").innerHTML=list.map((x,i)=>`<div class="item"><div class="top"><b style="flex:1">${esc(x.name)}</b><button class="btn small primary" data-idea="${i}">Рецепт</button></div>

/* ---------- Норма калорий ---------- */
const ACT=[[1.2,"Сидячий","Работа за компьютером, почти без спорта"],[1.375,"Лёгкая","Прогулки или 1–3 тренировки в неделю"],[1.55,"Средняя","3–5 тренировок в неделю"],[1.725,"Высокая","6–7 тренировок или работа на ногах"],[1.9,"Очень высокая","Физический труд плюс спорт"]];
const SPEED={slow:{pct:.10,gain:.05,name:"Медленно",about:"Легко держать, почти без голода"},mid:{pct:.18,gain:.10,name:"Умеренно",about:"Оптимальный темп для большинства"},fast:{pct:.25,gain:.15,name:"Быстро",about:"Нужна дисциплина, следи за самочувствием"}};
function latestWeight(){const w=getWeights(),d=Object.keys(w).sort();return d.length?w[d[d.length-1]]:null}
function computeNorm(pr,weight,goalW){
  if(!pr||!pr.sex||!pr.year||!pr.height||!weight)return null;
  const age=new Date().getFullYear()-pr.year;if(age<14||age>100||pr.height<120||pr.height>230||weight<35)return null;
  const bmr=10*weight+6.25*pr.height-5*age+(pr.sex==="m"?5:-161), tdee=bmr*(pr.act||1.2), sp=SPEED[pr.speed||"mid"];
  let target=tdee, floored=false;
  if(pr.goal==="lose"){target=tdee*(1-sp.pct);const maxDef=weight*11;if(tdee-target>maxDef)target=tdee-maxDef;
    const floor=Math.max(pr.sex==="m"?1500:1200,bmr);if(target<floor){target=floor;floored=true}}
  else if(pr.goal==="gain")target=tdee*(1+sp.gain);
  target=Math.round(target/10)*10;
  const ref=pr.goal==="lose"&&goalW&&goalW<weight?(weight+goalW)/2:weight;
  const p=r0(ref*(pr.goal==="lose"?1.8:1.6)), f=r0(Math.max(ref*0.8,target*0.25/9)), c=Math.max(0,r0((target-p*4-f*9)/4));
  const diff=tdee-target, pace=diff*7/7700;
  let weeks=null;if(goalW&&pr.goal==="lose"&&goalW<weight&&pace>0)weeks=Math.ceil((weight-goalW)/pace);
  if(goalW&&pr.goal==="gain"&&goalW>weight&&pace<0)weeks=Math.ceil((goalW-weight)/-pace);
  return{bmr:r0(bmr),tdee:r0(tdee),target,p,f,c,diff:r0(diff),pace,floored,weeks,age}
}
function applyAutoNorm(){const pr=S.settings.profile;if(!pr?.auto)return false;
  const n=computeNorm(pr,latestWeight()||pr.weight,S.settings.goalW);if(!n)return false;
  const changed=n.target!==S.settings.goal;Object.assign(S.settings,{goal:n.target,p:n.p,f:n.f,c:n.c});saveSettings();return changed?n.target:false}

function reviewData(scope){
  const g=S.settings,goals={kcal:g.goal,protein:g.p,fat:g.f,carbs:g.c};
  const pack=e=>{const v=calc(e.per100,e.grams);return{meal:MEAL_NAME[e.meal],name:e.name,g:e.grams,kcal:r0(v.k),p:r1(v.p),f:r1(v.f),c:r1(v.c)}};
  const tot=list=>{const t=totals(list);return{kcal:r0(t.k),p:r0(t.p),f:r0(t.f),c:r0(t.c)}};
  if(scope==="day"){const list=getDay(S.date).entries;return{n:list.length,data:{goals,totals:tot(list),foods:list.map(pack)}}}
  const days=[...Array(7)].map((_,i)=>addDays(S.date,i-6)).map(d=>({d,list:getDay(d).entries}));
  const foods={};days.forEach(x=>x.list.forEach(e=>{const k=e.name.toLowerCase();foods[k]=foods[k]||{name:e.name,times:0,kcal:0};foods[k].times++;foods[k].kcal+=calc(e.per100,e.grams).k}));
  return{n:days.filter(x=>x.list.length).length,data:{goals,days:days.map(x=>({date:x.d,records:x.list.length,...tot(x.list)})),
    topFoods:Object.values(foods).sort((a,b)=>b.kcal-a.kcal).slice(0,15).map(f=>({name:f.name,times:f.times,kcal:r0(f.kcal)}))}};
}
function openReview(scope){
  const {n,data}=reviewData(scope), isToday=scope==="day"&&S.date===ds(new Date());
  const sig=JSON.stringify(data), key=`review-${scope}-${S.date}`, cached=store.get(key);
  const title=scope==="day"?(isToday?"Разбор дня":`Разбор за ${shortDate(S.date)}`):"Разбор недели";
  openSheet(`<h3>${title}<button class="x" aria-label="Закрыть">×</button></h3><div class="stack"><div class="status" id="rvSt" hidden></div><div id="rvBox" class="stack"></div>
    <button class="btn" id="rvAgain" hidden>Разобрать заново</button>
    <div class="small-note">Это советы нейросети, а не врача. Ориентируйся на самочувствие.</div></div>`);
  const show=rv=>{const sec=(t,arr,col)=>arr?.length?`<div><div class="sec-title" style="margin:2px 2px 8px;color:${col}">${t}</div><div class="list">${arr.map(x=>`<div class="ing" style="align-items:flex-start"><span style="white-space:normal">${esc(x)}</span></div>`).join("")}</div></div>`:"";
    $("#rvBox").innerHTML=`${rv.verdict?`<div class="prodcard">${esc(rv.verdict)}</div>`:""}${sec("Получается хорошо",rv.good,"var(--accent)")}${sec("Что поправить",rv.fix,"var(--carb)")}${sec(scope==="week"?"На следующую неделю":isToday?"До конца дня":"На завтра",rv.next,"var(--ink)")}`;
    $("#rvAgain").hidden=false};
  const run=async()=>{kitchenCtl?.abort();kitchenCtl=new AbortController();$("#rvAgain").hidden=true;$("#rvBox").innerHTML="";
    setStatus($("#rvSt"),"busy","Смотрю на твой рацион… 5–15 секунд");
    try{const j=await ask({mode:"review",scope,isToday,hour:new Date().getHours(),data},kitchenCtl.signal);
      if(!j.review||(!j.review.verdict&&!j.review.fix.length)){setStatus($("#rvSt"),"err","Разбор не получился. Попробуй ещё раз.");$("#rvAgain").hidden=false;return}

async function shrink(file){
  const bmp=await createImageBitmap(file);const s=Math.min(1,1280/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
  const url=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=no;fr.readAsDataURL(blob)});
  return url.split(",")[1];
}

function readProductForm(){return{name:$("#pfName").value.trim()||"Продукт",grams:num($("#pfGrams").value),per100:{k:num($("#pfK").value),p:num($("#pfP").value),f:num($("#pfF").value),c:num($("#pfC").value)}}}
function fillProductForm(p){$("#pfName").value=p.name||"";$("#pfGrams").value=p.grams||100;$("#pfK").value=p.per100.k;$("#pfP").value=p.per100.p;$("#pfF").value=p.per100.f;$("#pfC").value=p.per100.c;$("#pfK").dispatchEvent(new Event("input"))}
function wireProductForm(){const upd=()=>{const p=readProductForm(),v=calc(p.per100,p.grams);$("#pfTotal").textContent=`${fmt(v.k)} ккал · Б ${fmt1(v.p)} · Ж ${fmt1(v.f)} · У ${fmt1(v.c)}`};
  ["#pfGrams","#pfK","#pfP","#pfF","#pfC"].forEach(s=>$(s).addEventListener("input",upd));upd()}

/* ---------- фото еды или этикетки ---------- */
function openPhoto(meal){
  const st={meal,file:null};
  openSheet(`<h3>Фото еды<button class="x" aria-label="Закрыть">×</button></h3><div class="stack">${mealChips(meal)}
    ${photoPicker("foodFile","Сфоткать еду или этикетку",true)}
    <img class="preview" id="foodPrev" alt="Выбранное фото" hidden>
    <label class="field">Уточнение, если нужно<input type="text" id="foodNote" placeholder="Например: съел половину пачки, жарено на масле"></label>
    <button class="btn" id="foodGo" disabled>Посчитать заново</button>
    <div class="status" id="foodSt" hidden></div><div id="foodItems"></div></div>`);
  wireMealChips(st);
  $("#foodFile").addEventListener("change",e=>{const f=e.target.files?.[0];if(!f)return;st.file=f;const im=$("#foodPrev");im.src=URL.createObjectURL(f);im.hidden=false;$("#foodGo").disabled=false;run()});
  $("#foodGo").addEventListener("click",run);
  async function run(){
    if(!st.file)return;sheetCtl?.abort();sheetCtl=new AbortController();const sig=sheetCtl.signal;
    $("#foodGo").disabled=true;$("#foodItems").innerHTML="";setStatus($("#foodSt"),"busy","Смотрю на фото… обычно 3–10 секунд");
    try{const image=await shrink(st.file);const items=await analyze({mode:"photo",image,mime:"image/jpeg",note:$("#foodNote").value.trim()},sig);
      if(!items.length){setStatus($("#foodSt"),"err","Не нашёл на фото ни еды, ни таблицы КБЖУ. Сними ближе и при хорошем свете.");return}
      const lbl=items.some(i=>i.source==="label"),est=items.some(i=>i.source!=="label");
      setStatus($("#foodSt"),"",lbl&&!est?"Цифры с этикетки. Укажи, сколько грамм съел.":lbl?"Часть цифр с этикетки, часть — оценка. Проверь вес.":"Вес — оценка на глаз. Поправь, если знаешь точнее.");
      renderItems($("#foodItems"),items,st,sel=>addEntries(st.meal,sel));
    }catch(e){if(e.name!=="AbortError")setStatus($("#foodSt"),"err",e.message)}
    finally{if($("#foodGo"))$("#foodGo").disabled=false}
  }
}

/* ---------- штрих-код: живой сканер + Open Food Facts ---------- */
async function offLookup(code){
  try{const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_ru,brands,product_quantity,nutriments`);
    if(!r.ok)return null;const j=await r.json();if(j.status!==1||!j.product)return null;
    const p=j.product,n=p.nutriments||{};let k=n["energy-kcal_100g"];if(k==null&&n["energy_100g"]!=null)k=n["energy_100g"]/4.184;
    const name=[p.product_name_ru||p.product_name,(p.brands||"").split(",")[0]].filter(Boolean).join(", ")||"Товар";
    if(k==null)return{name,incomplete:true};
    return{name,grams:num(p.product_quantity)||100,per100:{k:r1(num(k)),p:r1(num(n.proteins_100g)),f:r1(num(n.fat_100g)),c:r1(num(n.carbohydrates_100g))}};
  }catch(e){return null}
}
function openBarcode(meal){
  const st={meal,code:null};
  openSheet(`<h3>Штрих-код<button class="x" aria-label="Закрыть">×</button></h3><div class="stack">${mealChips(meal)}
    <div class="scanbox" id="scanBox"><video id="scanVideo" playsinline muted></video><div class="aim"></div></div>
    <div class="grid2"><input type="text" inputmode="numeric" id="bcCode" placeholder="или введи цифры" aria-label="Цифры штрих-кода"><button class="btn" id="bcFind">Найти</button></div>
    <div class="status" id="bcSt" hidden></div><div id="bcBody"></div></div>`);
  wireMealChips(st);
  $("#bcFind").addEventListener("click",()=>{const c=$("#bcCode").value.replace(/\D/g,"");if(c.length<6){setStatus($("#bcSt"),"err","В штрих-коде обычно 8 или 13 цифр.");return}stopScan?.();lookup(c)});
  startScan();
  async function startScan(){
    if(!("BarcodeDetector" in window)){$("#scanBox").hidden=true;setStatus($("#bcSt"),"err","Этот браузер не умеет сканировать. Открой приложение в Chrome или введи цифры.");return}
    let stream;
    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1280},height:{ideal:720}},audio:false})}
    catch(e){$("#scanBox").hidden=true;setStatus($("#bcSt"),"err","Нет доступа к камере. Разреши камеру для сайта в настройках браузера или введи цифры.");return}
    if($("#overlay").hidden||!$("#scanVideo")){stream.getTracks().forEach(t=>t.stop());return}
    const v=$("#scanVideo");v.srcObject=stream;await v.play().catch(()=>{});
    let det;try{det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128"]})}catch(e){det=new BarcodeDetector()}
    let alive=true,timer;
    stopScan=()=>{alive=false;clearTimeout(timer);stream.getTracks().forEach(t=>t.stop());const b=$("#scanBox");if(b)b.hidden=true};
    setStatus($("#bcSt"),"","Наведи камеру на штрих-код");
    const tick=async()=>{if(!alive)return;
      try{if(v.readyState>=2){const r=await det.detect(v);const c=r?.[0]?.rawValue?.replace(/\D/g,"");
        if(c&&c.length>=6&&alive){navigator.vibrate?.(60);stopScan();$("#bcCode").value=c;lookup(c);return}}}catch(e){}
      timer=setTimeout(tick,180)};
    tick();
  }
  async function lookup(code){
    st.code=code;$("#bcBody").innerHTML="";
    let p=store.get("bc-"+code),from="мой";
    if(!p){setStatus($("#bcSt"),"busy","Ищу в базе Open Food Facts…");p=await offLookup(code);from="off"}
    if(!$("#bcBody"))return;
    if(p&&p.per100){
      setStatus($("#bcSt"),"","");
      $("#bcBody").innerHTML=`<div class="stack"><div class="prodcard">${from==="off"?"Нашёл в Open Food Facts":"Нашёл в твоих товарах"}: <b>${esc(p.name)}</b> <span class="code">${code}</span></div>
        ${productFormHTML(p)}<div class="small-note">Проверь цифры с упаковкой — в общей базе бывают ошибки.</div><button class="btn primary" id="bcAdd">Добавить</button></div>`;
    }else{
      setStatus($("#bcSt"),"","");
      $("#bcBody").innerHTML=`<div class="stack"><div class="prodcard">${p?.name?`<b>${esc(p.name)}</b> есть в базе, но без КБЖУ.`:`Товара <span class="code">${code}</span> нет в базе.`}
        Сфоткай таблицу «Пищевая ценность» на упаковке — запомню его, и в следующий раз он найдётся сразу.</div>
        ${photoPicker("lblFile","Сфоткать этикетку",true)}<div class="status" id="lblSt" hidden></div>
        ${productFormHTML({name:p?.name||"",grams:100})}<button class="btn primary" id="bcAdd">Запомнить и добавить</button></div>`;
      $("#lblFile").addEventListener("change",async e=>{const f=e.target.files?.[0];if(!f)return;sheetCtl?.abort();sheetCtl=new AbortController();
        setStatus($("#lblSt"),"busy","Читаю этикетку…");
        try{const items=await analyze({mode:"photo",image:await shrink(f),mime:"image/jpeg",note:"Это упаковка товара, нужна таблица пищевой ценности"},sheetCtl.signal);
          const it=items.find(i=>i.source==="label")||items[0];
          if(!it){setStatus($("#lblSt"),"err","Не вижу таблицу КБЖУ. Сфоткай её ближе или впиши цифры сам.");return}
          fillProductForm({name:$("#pfName").value||it.name,grams:it.grams,per100:it.per100});setStatus($("#lblSt"),"","Цифры с этикетки. Проверь и укажи вес порции.");
        }catch(err){if(err.name!=="AbortError")setStatus($("#lblSt"),"err",err.message)}});
    }
    wireProductForm();
    $("#bcAdd").addEventListener("click",()=>{const q=readProductForm();
      if(!q.per100.k&&!q.per100.p&&!q.per100.c){toast("Впиши хотя бы калории на 100 г");return}if(!q.grams){toast("Укажи вес порции");return}
      store.set("bc-"+st.code,{name:q.name,per100:q.per100,grams:q.grams});addEntries(st.meal,[q])});
  }
}

/* ---------- вручную ---------- */
function openManual(meal){
  const st={meal},rec=S.settings.recent||[],rs=getRecipes();
  openSheet(`<h3>Добавить вручную<button class="x" aria-label="Закрыть">×</button></h3><div class="stack">${mealChips(meal)}
    ${rs.length?`<div><div class="small-note" style="margin-bottom:6px">Мои рецепты</div><div class="chips">${rs.slice(0,12).map(r=>`<button class="chip" data-rcp="${r.id}">${esc(r.name)}</button>`).join("")}</div></div>`:""}
    ${rec.length?`<div><div class="small-note" style="margin-bottom:6px">Недавние</div><div class="chips">${rec.slice(0,10).map((r,i)=>`<button class="chip" data-rec="${i}">${esc(r.name)}</button>`).join("")}</div></div>`:""}
    <label class="field">Опиши словами, что съел<textarea id="txt" placeholder="Гречка 200 г, куриная грудка 150 г, огурец"></textarea></label>
    <button class="btn primary" id="txtGo">Посчитать</button><div class="status" id="txtSt" hidden></div><div id="txtItems"></div>
    <details id="ownNums"><summary>Ввести свои цифры</summary><div style="margin-top:10px" class="stack">${productFormHTML({grams:100})}<button class="btn primary" id="pfAdd">Добавить</button></div></details></div>`);
  wireMealChips(st);wireProductForm();
  $("#sheet").querySelectorAll("[data-rcp]").forEach(b=>b.addEventListener("click",()=>openRecipeUse(b.dataset.rcp,st.meal)));
  $("#pfAdd").addEventListener("click",()=>{const p=readProductForm();if(!p.per100.k){toast("Впиши калории на 100 г");return}if(!p.grams){toast("Укажи вес");return}addEntries(st.meal,[p])});
  $("#sheet").querySelectorAll("[data-rec]").forEach(b=>b.addEventListener("click",()=>{$("#ownNums").open=true;fillProductForm(rec[b.dataset.rec]);$("#pfGrams").focus();$("#pfGrams").select()}));
  $("#txtGo").addEventListener("click",async()=>{const txt=$("#txt").value.trim();if(!txt){$("#txt").focus();return}
    sheetCtl?.abort();sheetCtl=new AbortController();$("#txtGo").disabled=true;$("#txtItems").innerHTML="";setStatus($("#txtSt"),"busy","Считаю…");
    try{const items=await analyze({mode:"text",text:txt},sheetCtl.signal);
      if(!items.length){setStatus($("#txtSt"),"err","Не понял, что это за еда. Напиши иначе.");return}
      setStatus($("#txtSt"),"","");renderItems($("#txtItems"),items,st,sel=>addEntries(st.meal,sel));
    }catch(e){if(e.name!=="AbortError")setStatus($("#txtSt"),"err",e.message)}finally{if($("#txtGo"))$("#txtGo").disabled=false}});
}

/* ---------- правка записи ---------- */
function openEdit(id){
  const e=S.day.entries.find(x=>x.id===id);if(!e)return;const st={meal:e.meal};
  openSheet(`<h3>${esc(e.name)}<button class="x" aria-label="Закрыть">×</button></h3><div class="stack">${mealChips(e.meal)}${productFormHTML(e)}
    <div class="btn-row"><button class="btn danger" id="edDel">Удалить</button><button class="btn primary" id="edSave">Сохранить</button></div></div>`);
  wireMealChips(st);wireProductForm();
  $("#edDel").addEventListener("click",()=>{S.day.entries=S.day.entries.filter(x=>x.id!==id);saveDay();render();closeSheet();toast("Удалено")});
  $("#edSave").addEventListener("click",()=>{const p=readProductForm();if(!p.grams){toast("Укажи вес");return}
    Object.assign(e,{name:p.name,grams:r0(p.grams),per100:p.per100,meal:st.meal});saveDay();render();closeSheet()});
}

/* ---------- цели, код доступа, резервная копия ---------- */
function openSettings(note){
  const g=S.settings;
  openSheet(`<h3>Цели и настройки<button class="x" aria-label="Закрыть">×</button></h3><div class="stack">
    ${note?`<div class="prodcard" style="background:var(--surface);color:var(--danger)">${esc(note)}</div>`:""}
    <button class="btn primary" id="sgNorm">${g.profile?"Пересчитать мою норму":"Рассчитать мою норму"}</button>
    ${g.profile?.auto?`<div class="small-note">Норма считается автоматически по весу (${{lose:"похудение",keep:"удержание",gain:"набор"}[g.profile.goal]}${g.profile.goal!=="keep"?", "+SPEED[g.profile.speed||"mid"].name.toLowerCase():""}). Если изменишь цифры ниже вручную — автопересчёт выключится.</div>`:""}
    <div class="grid2"><label class="field">Калории в день, ккал<input type="number" inputmode="numeric" id="sgK" value="${g.goal}"></label>
      <label class="field">Цель по весу, кг<input type="number" inputmode="decimal" step="0.1" id="sgW" value="${g.goalW??""}"></label></div>
    <div class="grid3"><label class="field">Белки, г<input type="number" inputmode="numeric" id="sgP" value="${g.p}"></label>
      <label class="field">Жиры, г<input type="number" inputmode="numeric" id="sgF" value="${g.f}"></label>
      <label class="field">Углеводы, г<input type="number" inputmode="numeric" id="sgC" value="${g.c}"></label></div>
    <div class="small-note num" id="sgHint"></div>
    <label class="field">Код доступа<input type="password" id="sgCode" value="${esc(store.get("appCode")||"")}" autocomplete="off"></label>
    <button class="btn primary" id="sgSave">Сохранить</button>
    <div class="small-note">Дневник, рецепты и вес хранятся на этом телефоне. Сохраняй копию, чтобы не потерять их при очистке браузера.</div>
    <div class="btn-row"><button class="btn" id="bkSave">Сохранить копию</button>
      <div class="picker btn">Загрузить копию<input type="file" id="bkLoad" accept="application/json,.json" aria-label="Загрузить копию"></div></div></div>`);
  const hint=()=>{$("#sgHint").textContent=`Белки, жиры и углеводы вместе дают ${fmt(num($("#sgP").value)*4+num($("#sgF").value)*9+num($("#sgC").value)*4)} ккал`};
  ["#sgP","#sgF","#sgC"].forEach(s=>$(s).addEventListener("input",hint));hint();
  $("#sgNorm").addEventListener("click",openNorm);
  $("#sgSave").addEventListener("click",()=>{const before=[g.goal,g.p,g.f,g.c].join();Object.assign(S.settings,{goal:num($("#sgK").value)||2000,goalW:num($("#sgW").value)||null,p:num($("#sgP").value),f:num($("#sgF").value),c:num($("#sgC").value)});
    if(S.settings.profile?.auto&&[S.settings.goal,S.settings.p,S.settings.f,S.settings.c].join()!==before)S.settings.profile.auto=false;
    const code=$("#sgCode").value.trim();code?store.set("appCode",code):store.del("appCode");saveSettings();render();closeSheet();toast("Сохранено")});
  $("#bkSave").addEventListener("click",()=>{const data={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith("kbju:")&&k!=="kbju:appCode")data[k]=localStorage.getItem(k)}
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:"application/json"}));a.download=`kbju-${ds(new Date())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)});
  $("#bkLoad").addEventListener("change",async e=>{const f=e.target.files?.[0];if(!f)return;
    try{const data=JSON.parse(await f.text());let n=0;for(const[k,v]of Object.entries(data)){if(k.startsWith("kbju:")&&typeof v==="string"){localStorage.setItem(k,v);n++}}
      S.settings={...S.settings,...(store.get("settings")||{})};loadDay();closeSheet();toast(`Загружено записей: ${n}`)}catch(err){toast("Это не файл копии дневника")}});
}
function askCode(wrong){openSettings(wrong?"Код доступа не подошёл. Проверь его и сохрани ещё раз.":"Чтобы распознавать еду, введи код доступа и нажми «Сохранить».");setTimeout(()=>{$("#sgCode")?.focus()},350)}

/* ---------- события ---------- */
function openAdd(mode,meal){meal=meal||defaultMeal();mode==="photo"?openPhoto(meal):mode==="barcode"?openBarcode(meal):openManual(meal)}
document.querySelectorAll("[data-add]").forEach(b=>b.addEventListener("click",()=>openAdd(b.dataset.add)));
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{S.tab=b.dataset.tab;if(S.tab!=="day"&&S.tab!=="week")S.date=ds(new Date());S.tab==="day"?loadDay():render();window.scrollTo({top:0})}));
$("#view").addEventListener("click",e=>{const act=e.target.closest("[data-act]")?.dataset.act;if(act==="norm")return openNorm();if(act==="review-day")return openReview("day");if(act==="review-week")return openReview("week");const a=e.target.closest("[data-addmeal]");if(a)return openAdd("photo",a.dataset.addmeal);const en=e.target.closest("[data-entry]");if(en)openEdit(en.dataset.entry)});
$("#openSettings").addEventListener("click",()=>openSettings());
function shift(n){const nd=addDays(S.date,n*(S.tab==="week"?7:1));const t=ds(new Date());S.date=nd>t?t:nd;loadDay()}
$("#prevDay").addEventListener("click",()=>shift(-1));$("#nextDay").addEventListener("click",()=>shift(1));
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopScan?.()});

S.settings={...S.settings,...(store.get("settings")||{})};
applyAutoNorm();
loadDay();
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
